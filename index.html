<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Tiki's Tokyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #C96B50;
    --coral-light: #E8927A;
    --teal: #2D6B6B;
    --teal-light: #4A9494;
    --cream: #F5EFE6;
    --sand: #D4BC9A;
    --amber: #B8860B;
    --sage: #6B8C6B;
    --dark: #1A1A1A;
    --mid: #4A4A4A;
    --light: #8A8A8A;
    --hairline: #D8D0C4;
    --bg: #FDFAF6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Shippori Mincho B1', serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: var(--dark);
    color: var(--cream);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--sand);
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4CAF50;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Hero ── */
  .hero {
    text-align: center;
    padding: 40px 24px 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .hero-month {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 3vw, 15px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--light);
    margin-bottom: 6px;
  }
  .hero-title {
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(13px, 2.5vw, 16px);
    color: var(--coral);
    letter-spacing: 0.05em;
  }
  .wave {
    margin: 20px auto 0;
    display: block;
  }

  /* ── Nav ── */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--hairline);
  }
  .nav-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--mid);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    padding: 6px 16px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--coral); color: var(--coral); }
  .nav-month {
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 500;
    letter-spacing: 0.08em;
    min-width: 160px;
    text-align: center;
  }
  .nav-month span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--light);
    display: block;
    letter-spacing: 0.1em;
  }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    overflow-x: auto;
    border-bottom: 1px solid var(--hairline);
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    white-space: nowrap;
    padding: 5px 14px;
    border: 1px solid var(--hairline);
    background: none;
    font-family: 'Shippori Mincho B1', serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    color: var(--mid);
    transition: all 0.2s;
  }
  .filter-btn.active { background: var(--dark); color: var(--cream); border-color: var(--dark); }
  .filter-btn[data-type="hula"].active { background: var(--coral); border-color: var(--coral); }
  .filter-btn[data-type="tahitian"].active { background: #B05040; border-color: #B05040; }
  .filter-btn[data-type="yoga"].active { background: var(--sage); border-color: var(--sage); }
  .filter-btn[data-type="music"].active { background: var(--teal); border-color: var(--teal); }
  .filter-btn[data-type="workshop"].active { background: var(--amber); border-color: var(--amber); }

  /* ── Calendar Grid ── */
  .calendar-wrap {
    padding: 0 16px 40px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 2px solid var(--dark);
    margin-top: 16px;
  }
  .weekday-header div {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 8px 4px;
    color: var(--mid);
  }
  .weekday-header div:first-child { color: var(--coral); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cal-cell {
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    min-height: 110px;
    padding: 6px 8px 8px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:hover { background: #FAF6F0; }
  .cal-cell.other-month { opacity: 0.35; }
  .cal-cell.today { background: #FFF8F4; }
  .cal-cell.today .cell-date { color: var(--coral); font-weight: 600; }
  .cal-cell.sunday .cell-date { color: var(--coral); }
  .cal-cell.saturday .cell-date { color: var(--teal); }
  .cal-cell.closed { background: repeating-linear-gradient(135deg, transparent, transparent 6px, rgba(0,0,0,0.025) 6px, rgba(0,0,0,0.025) 12px); }
  .cal-cell.featured { outline: 1.5px solid var(--amber); }

  .cell-date {
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(15px, 2.5vw, 20px);
    font-weight: 500;
    line-height: 1;
    margin-bottom: 6px;
  }
  .cell-events { display: flex; flex-direction: column; gap: 3px; }
  .event-pill {
    font-family: 'Shippori Mincho B1', serif;
    font-size: 10px;
    line-height: 1.3;
    padding: 1px 0;
    border-left: 2px solid currentColor;
    padding-left: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-pill.hula     { color: var(--coral); }
  .event-pill.tahitian { color: #B05040; }
  .event-pill.yoga     { color: var(--sage); }
  .event-pill.music    { color: var(--teal); }
  .event-pill.workshop { color: var(--amber); }
  .event-pill.special  { color: var(--dark); }
  .event-pill.closed   { color: var(--light); font-style: italic; }
  .event-pill.featured-pill { font-weight: 600; }

  /* Mobile: dots instead of text */
  @media (max-width: 600px) {
    .cal-cell { min-height: 64px; padding: 4px 5px; }
    .cell-date { font-size: 13px; }
    .event-pill { display: none; }
    .dot-row { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 3px; }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
    }
    .dot.hula     { background: var(--coral); }
    .dot.tahitian { background: #B05040; }
    .dot.yoga     { background: var(--sage); }
    .dot.music    { background: var(--teal); }
    .dot.workshop { background: var(--amber); }
    .dot.special  { background: var(--dark); }
    .dot.closed   { background: var(--hairline); }
  }
  @media (min-width: 601px) {
    .dot-row { display: none; }
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none;
    font-size: 20px; cursor: pointer;
    color: var(--mid); line-height: 1;
  }
  .modal-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--light);
    margin-bottom: 4px;
  }
  .modal-title {
    font-family: 'Shippori Mincho B1', serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .modal-events { display: flex; flex-direction: column; gap: 16px; }
  .modal-event {
    padding: 12px 16px;
    border-left: 3px solid var(--hairline);
  }
  .modal-event.hula     { border-color: var(--coral); }
  .modal-event.tahitian { border-color: #B05040; }
  .modal-event.yoga     { border-color: var(--sage); }
  .modal-event.music    { border-color: var(--teal); }
  .modal-event.workshop { border-color: var(--amber); }
  .modal-event.special  { border-color: var(--dark); }
  .modal-event.featured { background: #FFF9ED; border-color: var(--amber); }
  .modal-event-title {
    font-family: 'Shippori Mincho B1', serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .modal-event-time {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--mid);
    margin-bottom: 4px;
  }
  .modal-event-desc {
    font-size: 12px;
    color: var(--light);
    line-height: 1.6;
    white-space: pre-line;
  }
  .modal-empty {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--light);
    text-align: center;
    padding: 20px 0;
  }

  /* ── Footer info ── */
  .cal-footer {
    text-align: center;
    padding: 24px;
    border-top: 1px solid var(--hairline);
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--light);
  }
  .cal-footer a { color: var(--teal); }

  /* ── Loading ── */
  .loading-overlay {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 300;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .loading-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--mid);
    letter-spacing: 0.05em;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--hairline);
    border-top-color: var(--coral);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-overlay show" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">イベント情報を読み込んでいます...</div>
</div>

<header class="site-header">
  <div class="brand">Tiki's Tokyo</div>
  <div class="live-badge">
    <span class="live-dot"></span>
    <span id="lastUpdated">読込中...</span>
  </div>
</header>

<div class="hero">
  <div class="hero-month" id="heroMonth"></div>
  <div class="hero-title">Events</div>
  <div class="hero-sub">— Aloha Every Day —</div>
  <svg class="wave" width="200" height="20" viewBox="0 0 200 20">
    <path d="M0,10 C25,0 50,20 75,10 S125,0 150,10 S175,20 200,10" fill="none" stroke="#C96B50" stroke-width="1.5" opacity="0.5"/>
  </svg>
</div>

<div class="cal-nav">
  <button class="nav-btn" id="prevBtn">← 前月</button>
  <div class="nav-month" id="navMonth">
    <span id="navMonthSub"></span>
  </div>
  <button class="nav-btn" id="nextBtn">翌月 →</button>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-type="all">すべて</button>
  <button class="filter-btn" data-type="hula">フラ</button>
  <button class="filter-btn" data-type="tahitian">タヒチアン</button>
  <button class="filter-btn" data-type="yoga">ヨガ</button>
  <button class="filter-btn" data-type="music">ライブ</button>
  <button class="filter-btn" data-type="workshop">ワークショップ</button>
  <button class="filter-btn" data-type="special">特別企画</button>
</div>

<div class="calendar-wrap">
  <div class="weekday-header">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<footer class="cal-footer">
  Tiki's Tokyo — 代々木公園 BE STAGE 1F<br>
  <a href="https://www.instagram.com/tikis.tokyo/" target="_blank">@tikis.tokyo</a>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-events" id="modalEvents"></div>
  </div>
</div>

<script>
// ── State ──
let allEvents = [];
let currentYear, currentMonth;
let activeFilter = 'all';
let fetchedAt = null;

const MONTHS_JA = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const MONTHS_HW = ["'Ianuali","Pepeluali","Malaki","'Apelila","Mei","Iune","Iulai",'Aukake',"Kepakemapa","'Okakopa","Nowemapa","Kekemapa"];
const DAYS_JA   = ['日','月','火','水','木','金','土'];

// ── Init ──
const now = new Date();
currentYear  = now.getFullYear();
currentMonth = now.getMonth(); // 0-based

updateHeroMonth();
renderNavMonth();
loadEvents();

// Auto-refresh every 5 min
setInterval(loadEvents, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && fetchedAt && Date.now() - fetchedAt > 5 * 60 * 1000) {
    loadEvents();
  }
});

// ── Fetch ──
async function loadEvents() {
  try {
    const res = await fetch('/api/events');
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    allEvents = data.events || [];
    fetchedAt = Date.now();
    updateLastUpdated();
    renderCalendar();
  } catch (e) {
    console.error('fetch error:', e);
    document.getElementById('lastUpdated').textContent = '取得失敗';
    renderCalendar(); // render empty
  } finally {
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

function updateLastUpdated() {
  if (!fetchedAt) return;
  const mins = Math.floor((Date.now() - fetchedAt) / 60000);
  const txt = mins === 0 ? 'たった今' : `${mins}分前`;
  document.getElementById('lastUpdated').textContent = `LIVE · 最終更新 ${txt}`;
}
setInterval(updateLastUpdated, 60000);

// ── Nav ──
document.getElementById('prevBtn').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderNavMonth(); updateHeroMonth(); renderCalendar();
};
document.getElementById('nextBtn').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderNavMonth(); updateHeroMonth(); renderCalendar();
};

function updateHeroMonth() {
  document.getElementById('heroMonth').textContent =
    `${MONTHS_HW[currentMonth]} · ${currentYear}`;
}
function renderNavMonth() {
  document.getElementById('navMonth').innerHTML =
    `${currentYear}年 ${MONTHS_JA[currentMonth]}<span>${MONTHS_HW[currentMonth].toUpperCase()}</span>`;
}

// ── Filters ──
document.getElementById('filters').onclick = e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.type;
  renderCalendar();
};

// ── Calendar Render ──
function getEventsForDate(dateStr) {
  return allEvents.filter(ev => {
    if (ev.date !== dateStr) return false;
    if (activeFilter === 'all') return true;
    return ev.type === activeFilter;
  });
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const todayStr = formatDateStr(now);

  // Leading cells from prev month
  const prevDays = new Date(currentYear, currentMonth, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    const d = prevDays - firstDay + 1 + i;
    const prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
    const prevYear  = currentMonth === 0 ? currentYear - 1 : currentYear;
    const dateStr = `${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    grid.appendChild(makeCell(d, dateStr, true));
  }

  // Current month cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    grid.appendChild(makeCell(d, dateStr, false, dateStr === todayStr));
  }

  // Trailing cells
  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
    const nextYear  = currentMonth === 11 ? currentYear + 1 : currentYear;
    const dateStr = `${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    grid.appendChild(makeCell(i, dateStr, true));
  }
}

function makeCell(day, dateStr, otherMonth, isToday = false) {
  const cell = document.createElement('div');
  cell.className = 'cal-cell';
  if (otherMonth) cell.classList.add('other-month');
  if (isToday) cell.classList.add('today');

  // Day-of-week class
  const dow = new Date(dateStr).getDay();
  if (dow === 0) cell.classList.add('sunday');
  if (dow === 6) cell.classList.add('saturday');

  const events = getEventsForDate(dateStr);
  const hasClosed  = events.some(e => e.type === 'closed');
  const hasFeatured = events.some(e => e.featured);
  if (hasClosed) cell.classList.add('closed');
  if (hasFeatured) cell.classList.add('featured');

  // Date number
  const dateEl = document.createElement('div');
  dateEl.className = 'cell-date';
  dateEl.textContent = day;
  cell.appendChild(dateEl);

  // Event pills (desktop)
  const pillsEl = document.createElement('div');
  pillsEl.className = 'cell-events';
  const maxPills = 3;
  events.slice(0, maxPills).forEach(ev => {
    const pill = document.createElement('div');
    pill.className = `event-pill ${ev.type}${ev.featured ? ' featured-pill' : ''}`;
    const timeStr = ev.times && ev.times.length ? ev.times[0] + '~ ' : '';
    pill.textContent = timeStr + ev.title;
    pill.title = ev.title;
    pillsEl.appendChild(pill);
  });
  if (events.length > maxPills) {
    const more = document.createElement('div');
    more.className = 'event-pill special';
    more.textContent = `+${events.length - maxPills}件`;
    pillsEl.appendChild(more);
  }
  cell.appendChild(pillsEl);

  // Dots (mobile)
  if (events.length > 0) {
    const dotRow = document.createElement('div');
    dotRow.className = 'dot-row';
    events.slice(0, 5).forEach(ev => {
      const dot = document.createElement('div');
      dot.className = `dot ${ev.type}`;
      dotRow.appendChild(dot);
    });
    cell.appendChild(dotRow);
  }

  cell.onclick = () => openModal(dateStr, events);
  return cell;
}

// ── Modal ──
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openModal(dateStr, events) {
  const d = new Date(dateStr);
  const dow = DAYS_JA[d.getDay()];
  const [y, m, day] = dateStr.split('-');
  document.getElementById('modalDate').textContent =
    `${y}年 ${parseInt(m)}月 ${parseInt(day)}日（${dow}）`;
  document.getElementById('modalTitle').textContent =
    events.length ? `${events.length}件のイベント` : 'イベントなし';

  const container = document.getElementById('modalEvents');
  container.innerHTML = '';

  if (!events.length) {
    container.innerHTML = '<div class="modal-empty">この日は定期営業または休業日です</div>';
  } else {
    events.forEach(ev => {
      const el = document.createElement('div');
      el.className = `modal-event ${ev.type}${ev.featured ? ' featured' : ''}`;

      const timeStr = ev.times && ev.times.length
        ? ev.times.map(t => `${t}~`).join(' / ')
        : '';

      el.innerHTML = `
        <div class="modal-event-title">${ev.title}</div>
        ${timeStr ? `<div class="modal-event-time">${timeStr}</div>` : ''}
        ${ev.description ? `<div class="modal-event-desc">${ev.description}</div>` : ''}
      `;
      container.appendChild(el);
    });
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// ── Helpers ──
function formatDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
</script>
